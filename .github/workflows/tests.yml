name: Tests

on:
  push:
    branches:
      - main
      - '*.x'
      - 'feature/**'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [ 8.3, 8.4, 8.5 ]

    name: PHP ${{ matrix.php }}

    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: actamind-test
          POSTGRES_USER: actamind
          POSTGRES_PASSWORD: actamind_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U actamind"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Patch environment for CI
        run: |
          echo "DB_CONNECTION=pgsql"              >> .env
          echo "DB_HOST=127.0.0.1"                >> .env
          echo "DB_PORT=5432"                     >> .env
          echo "DB_DATABASE=actamind-test"        >> .env
          echo "DB_USERNAME=actamind"             >> .env
          echo "DB_PASSWORD=actamind_password"    >> .env

      - name: Execute tests
        run: php artisan test
